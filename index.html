<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>ToonFlash - Which Jar Has The Cookie?</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700;900&amp;family=Nunito:wght@700;800;900&amp;display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fbf8ff;
      font-family: 'Comfortaa', 'Nunito', sans-serif;
      user-select: none;
    }

    /* Ambient bear subtle facial animations (Bear body and head stay firmly stationary) */
    @keyframes bearBlink {

      0%,
      46%,
      50%,
      96%,
      100% {
        transform: scaleY(1);
      }

      48%,
      98% {
        transform: scaleY(0.08);
      }
    }

    @keyframes earWiggle {

      0%,
      80%,
      100% {
        transform: rotate(0deg);
      }

      85% {
        transform: rotate(-4deg);
      }

      90% {
        transform: rotate(2deg);
      }
    }

    /* Bear lowering arm into Left Jar (Midline X: 330) */
    @keyframes bearArmLowering {

      0%,
      15% {
        transform: translate(0px, 0px) rotate(0deg);
      }

      32%,
      40% {
        transform: translate(-76px, -65px) rotate(-16deg);
      }

      52%,
      58% {
        transform: translate(-104px, 45px) rotate(-34deg);
      }

      68% {
        transform: translate(-80px, -20px) rotate(-20deg);
      }

      80%,
      100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    @keyframes jumboCookieDescent {

      0%,
      15% {
        opacity: 1;
        transform: translate(0px, 0px);
      }

      32%,
      40% {
        opacity: 1;
        transform: translate(-105px, -115px);
      }

      48% {
        opacity: 1;
        transform: translate(-105px, -55px);
      }

      53% {
        opacity: 1;
        transform: translate(-105px, 0px) scale(0.96);
      }

      57% {
        opacity: 0;
        transform: translate(-105px, 45px) scale(0.85);
      }

      100% {
        opacity: 0;
        transform: translate(-105px, 45px);
      }
    }

    @keyframes jarPopImpact {

      0%,
      53% {
        transform: scale(1, 1);
      }

      56% {
        transform: scale(1.06, 0.94) translateY(4px);
      }

      60% {
        transform: scale(0.96, 1.04) translateY(-3px);
      }

      64% {
        transform: scale(1.02, 0.98) translateY(1px);
      }

      68%,
      100% {
        transform: scale(1, 1);
      }
    }

    /* Golden star sparkles bursting outward right as cookie settles in jar rim */
    @keyframes starBurstAction {

      0%,
      52% {
        opacity: 0;
        transform: scale(0);
      }

      56% {
        opacity: 1;
        transform: scale(1.2) translateY(-6px);
      }

      65% {
        opacity: 0.9;
        transform: scale(1.45) translateY(-20px);
      }

      74%,
      100% {
        opacity: 0;
        transform: scale(1.8) translateY(-30px);
      }
    }

    @keyframes bearGazeFollow {

      0%,
      15% {
        transform: translate(0, 0);
      }

      32%,
      42% {
        transform: translate(-7px, -1px);
      }

      48%,
      62% {
        transform: translate(-8px, 6px);
      }

      74%,
      100% {
        transform: translate(0, 0);
      }
    }

    .anim-blink {
      animation: bearBlink 3.8s ease-in-out infinite;
      transform-origin: 500px 240px;
    }

    .anim-ear-l {
      animation: earWiggle 5s ease-in-out infinite;
      transform-origin: 430px 170px;
    }

    .anim-ear-r {
      animation: earWiggle 5s ease-in-out infinite 0.4s;
      transform-origin: 570px 170px;
    }

    .intro-arm {
      animation: bearArmLowering 4.2s cubic-bezier(0.33, 1, 0.68, 1) forwards;
      transform-origin: 440px 320px;
    }

    .intro-cookie {
      animation: jumboCookieDescent 4.2s cubic-bezier(0.33, 1, 0.68, 1) forwards;
      transform-origin: 435px 345px;
    }

    .intro-jar1 {
      animation: jarPopImpact 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center center;
    }

    .intro-stars {
      animation: starBurstAction 4.2s ease-out forwards;
      transform-origin: 330px 290px;
    }

    .intro-gaze {
      animation: bearGazeFollow 4.2s ease-in-out forwards;
    }

    /* Interactive clickable jar hot zones with identical origin, lift up and blue glowing shadow */
    .jar-interactive {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center center;
      transition: translate 0.25s ease, scale 0.25s ease, filter 0.25s ease;
    }

    /* Individual translate/scale properties so the left jar's intro transform animation can't override them */
    .jar-interactive:hover {
      filter: drop-shadow(0 10px 18px rgba(30, 136, 229, 0.6));
      translate: 0 -8px;
      scale: 1.03;
    }

    .jar-interactive:active {
      translate: 0 -2px;
      scale: 0.98;
    }
  </style>
</head>

        <path d="M604 435 C596 375, 610 325, 628 310 L712 310 C730 325, 744 375, 736 435 C732 448, 608 448, 604 435 Z"
          fill="url(#jarUniformBlueGrad)" stroke="#2c1e14" stroke-linejoin="round" stroke-width="5.5"></path>
        <path d="M620 330 C614 372, 620 414, 626 430" fill="none" opacity="0.65" stroke="#e1f5fe" stroke-linecap="round"
          stroke-width="6"></path>
        <rect fill="#1e88e5" height="20" rx="6" stroke="#2c1e14" stroke-width="4.5" width="94" x="623" y="294"></rect>
        <!-- Rim Lip & Cavity -->
        <ellipse cx="670" cy="296" fill="#0d47a1" rx="46" ry="13" stroke="#2c1e14" stroke-width="5"></ellipse>
        <ellipse cx="670" cy="296" fill="#0a2a66" rx="38" ry="9"></ellipse>
      </g>
    </svg>
    <!-- SOUND SYNTHESIS & INTERACTION SCRIPT -->
    <script>
      let canClick = false;
      let audioCtx = null;
      let selectedSide = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function unlockAudio() {
        getAudioContext();
      }

      // Friendly cartoon Web Audio synthesis sound effects
      function playChime(type) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'swish') {
            // Gentle cartoon whoosh / swish while arm swings cookie over
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.linearRampToValueAtTime(1400, now + 0.3);
            filter.frequency.linearRampToValueAtTime(400, now + 0.7);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.35);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.7);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.3);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.7);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.71);
          } else if (type === 'drop') {
            // "Plop" tone + magical sparkle chime when cookie slides into jar
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.28);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.29);

            // Sparkle chime overlay
            [880, 1174.66, 1396.91, 1760].forEach((freq, idx) => {
              const spOsc = ctx.createOscillator();
              const spGain = ctx.createGain();
              spOsc.type = 'triangle';
              spOsc.frequency.setValueAtTime(freq, now + 0.05 + idx * 0.06);
              spGain.gain.setValueAtTime(0.12, now + 0.05 + idx * 0.06);
              spGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32 + idx * 0.06);
              spOsc.connect(spGain);
              spGain.connect(ctx.destination);
              spOsc.start(now + 0.05 + idx * 0.06);
              spOsc.stop(now + 0.35 + idx * 0.06);
            });
          } else if (type === 'hover') {
            // Subtle cartoon bubble-pop on jar hover
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(940, now + 0.08);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'select') {
            // Neutral soft tap/select sound
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'prompt') {
            // Inviting attention chime
            const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.11);
              gain.gain.setValueAtTime(0.18, now + i * 0.11);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.11 + 0.35);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.11);
              osc.stop(now + i * 0.11 + 0.36);
            });
          }
        } catch (e) {
          console.warn('Audio note prevented: ', e);
        }
      }

      function handleJarHover() {
        if (!canClick) return;
        playChime('hover');
      }

      function startSequence() {
        canClick = false;
        selectedSide = null;

        // Reset bear expressions
        document.getElementById('bear-mouth').setAttribute('d', 'M487 271 Q500 293 513 271 Z');
        document.getElementById('jar-left-glow').setAttribute('opacity', '0');
        document.getElementById('jar-right-glow').setAttribute('opacity', '0');

        // Restart animation classes by triggering reflow
        const elementsToRestart = [
          { id: 'bear-lowering-arm', cls: 'intro-arm' },
          { id: 'anim-cookie', cls: 'intro-cookie' },
          { id: 'jar-left-group', cls: 'intro-jar1' },
          { id: 'drop-stars', cls: 'intro-stars' },
          { id: 'bear-pupils', cls: 'intro-gaze' }
        ];

        elementsToRestart.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) {
            el.classList.remove(item.cls);
            void el.offsetWidth; // Force CSS reflow
            el.classList.add(item.cls);
          }
        });

        // Swish sound when bear starts moving arm over to jar
        setTimeout(() => {
          playChime('swish');
        }, 1300);

        // Plop sound and sparkle burst right as cookie settles into left jar
        setTimeout(() => {
          playChime('drop');
        }, 2250);

        // When lowering animation settles (~3.8s), ready for child to click
        setTimeout(() => {
          canClick = true;

          // Flash gentle guide rings around jars to invite interaction
          document.getElementById('jar-left-glow').setAttribute('opacity', '0.7');
          document.getElementById('jar-right-glow').setAttribute('opacity', '0.7');
          setTimeout(() => {
            if (!selectedSide) {
              document.getElementById('jar-left-glow').setAttribute('opacity', '0');
              document.getElementById('jar-right-glow').setAttribute('opacity', '0');
            }
          }, 800);

          playChime('prompt');
        }, 3800);
      }

      function handleJarChoice(side) {
        if (!canClick) return;

        selectedSide = side;
        playChime('select');

        // Neutral selection highlight on the chosen jar without revealing correctness
        document.getElementById('jar-left-glow').setAttribute('opacity', side === 'left' ? '0.75' : '0');
        document.getElementById('jar-right-glow').setAttribute('opacity', side === 'right' ? '0.75' : '0');

        // Dispatch neutral custom event for external handlers or state tracking
        window.dispatchEvent(new CustomEvent('jarSelected', { detail: { side: side } }));
      }

      // Auto start on page load
      window.addEventListener('DOMContentLoaded', () => {
        startSequence();
      });
    </script>
  </div>
