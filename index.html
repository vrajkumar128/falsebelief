<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>false belief</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700;900&amp;family=Nunito:wght@600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <!-- Icons for the grown-up setup screen (S1) only -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0&amp;icon_names=chair,front_hand,fullscreen,volume_up&amp;display=block"
    rel="stylesheet" />
  <!-- Styles shared by every screen, then each screen's own -->
  <link href="shared/base.css" rel="stylesheet" />
  <link href="screens/s1-setup.css" rel="stylesheet" />
  <link href="screens/s2-ready.css" rel="stylesheet" />
  <link href="screens/s3a-bear-intro.css" rel="stylesheet" />
  <link href="screens/s4-cookie-jars.css" rel="stylesheet" />
</head>

<body class="relative flex items-center justify-center min-h-screen bg-slate-950 select-none overflow-hidden">
  <!-- The stage every screen plays on (sized for the scenes' 1000 x 650 drawings). shared/storyline.js puts the
       screens from screens/ on it and shows one at a time. -->
  <div
    class="relative w-full max-w-[1200px] h-[95vh] max-h-[780px] rounded-3xl overflow-hidden shadow-2xl bg-[#fcefdc] border-4 border-amber-900/20 flex flex-col justify-center items-center"
    id="game-stage"></div>

  <script src="shared/sounds.js"></script>
  <script src="shared/storyline.js"></script>
  <!-- One script per screen (its styles are linked above). The order they play in is SCREEN_ORDER in
       shared/storyline.js. -->
  <script src="screens/s1-setup.js"></script>
  <script src="screens/s2-ready.js"></script>
  <script src="screens/s3a-bear-intro.js"></script>
  <script src="screens/s4-cookie-jars.js"></script>
</body>

</html>
