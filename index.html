<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>false belief</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700;900&amp;family=Nunito:wght@700;800;900&amp;display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Comfortaa', 'Nunito', sans-serif;
      user-select: none;
    }

    /* Ambient character subtle facial animations */
    @keyframes charBlink {

      0%,
      46%,
      50%,
      96%,
      100% {
        transform: scaleY(1);
      }

      48%,
      98% {
        transform: scaleY(0.08);
      }
    }

    @keyframes earWiggle {

      0%,
      80%,
      100% {
        transform: rotate(0deg);
      }

      85% {
        transform: rotate(-4deg);
      }

      90% {
        transform: rotate(2deg);
      }
    }

    /* Bear lowering arm into Left Jar (Midline X: 330) during intro */
    @keyframes bearArmLowering {

      0%,
      12% {
        transform: translate(0px, 0px) rotate(0deg);
      }

      28%,
      36% {
        transform: translate(-76px, -65px) rotate(-16deg);
      }

      48%,
      56% {
        transform: translate(-104px, 45px) rotate(-34deg);
      }

      68% {
        transform: translate(-70px, -10px) rotate(-15deg);
      }

      80%,
      100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    /* Initial Bear Cookie descent into Left Jar */
    @keyframes bearCookieDescent {

      0%,
      12% {
        opacity: 1;
        transform: translate(0px, 0px);
      }

      28%,
      36% {
        opacity: 1;
        transform: translate(-105px, -115px);
      }

      44% {
        opacity: 1;
        transform: translate(-105px, -55px);
      }

      50% {
        opacity: 1;
        transform: translate(-105px, -2px) scale(0.97);
      }

      58% {
        opacity: 1;
        transform: translate(-105px, 60px) scale(0.88);
      }

      62% {
        opacity: 0;
        transform: translate(-105px, 75px) scale(0.84);
      }

      100% {
        opacity: 0;
        transform: translate(-105px, 75px);
      }
    }

    @keyframes jarPopImpact {

      0%,
      48% {
        transform: scale(1, 1);
      }

      52% {
        transform: scale(1.06, 0.94) translateY(4px);
      }

      56% {
        transform: scale(0.96, 1.04) translateY(-3px);
      }

      60% {
        transform: scale(1.02, 0.98) translateY(1px);
      }

      65%,
      100% {
        transform: scale(1, 1);
      }
    }

    @keyframes starBurstAction {

      0%,
      48% {
        opacity: 0;
        transform: scale(0);
      }

      52% {
        opacity: 1;
        transform: scale(1.2) translateY(-6px);
      }

      60% {
        opacity: 0.9;
        transform: scale(1.45) translateY(-20px);
      }

      70%,
      100% {
        opacity: 0;
        transform: scale(1.8) translateY(-30px);
      }
    }

    @keyframes bearGazeFollow {

      0%,
      12% {
        transform: translate(0, 0);
      }

      28%,
      38% {
        transform: translate(-7px, -1px);
      }

      44%,
      58% {
        transform: translate(-8px, 6px);
      }

      70%,
      100% {
        transform: translate(0, 0);
      }
    }

    /* Walking waddle of the legs */
    @keyframes walkLegLeft {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(-6deg);
      }
    }

    @keyframes walkLegRight {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(6deg);
      }
    }

    @keyframes walkBodyBob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* Bear Departure (7.5s cubic-bezier) */
    @keyframes bearDepartureFull {

      0%,
      35% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 1;
      }

      45% {
        transform: translate(-90px, -20px) scale(0.94, 0.94);
        opacity: 1;
      }

      57% {
        transform: translate(-195px, -38px) scale(0.87, 0.87);
        opacity: 1;
      }

      68% {
        transform: translate(-290px, -48px) scale(0.81, 0.81);
        opacity: 1;
      }

      76% {
        transform: translate(-345px, -52px) scale(0.76, 0.76);
        opacity: 0.85;
      }

      82%,
      100% {
        transform: translate(-350px, -52px) scale(0.72, 0.72);
        opacity: 0;
      }
    }

    /* Bear Return Walk: mirrors departure back from left door to center table (5.2s) */
    @keyframes bearReturnFull {
      0% {
        transform: translate(-350px, -52px) scale(0.72, 0.72);
        opacity: 0;
      }

      10% {
        transform: translate(-345px, -52px) scale(0.76, 0.76);
        opacity: 0.9;
      }

      26% {
        transform: translate(-290px, -48px) scale(0.81, 0.81);
        opacity: 1;
      }

      45% {
        transform: translate(-195px, -38px) scale(0.87, 0.87);
        opacity: 1;
      }

      65% {
        transform: translate(-90px, -20px) scale(0.94, 0.94);
        opacity: 1;
      }

      88%,
      100% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 1;
      }
    }

    /* Left Door Swing Keyframes (Bear Exit) */
    @keyframes doorLeftOpenClose {

      0%,
      50% {
        transform: scaleX(1);
      }

      56% {
        transform: scaleX(0.18) skewY(-6deg);
      }

      61%,
      67% {
        transform: scaleX(0.06) skewY(-10deg);
      }

      74% {
        transform: scaleX(0.75);
      }

      80%,
      100% {
        transform: scaleX(1);
      }
    }

    /* Left Door Swing Keyframes (Bear Re-entrance) */
    @keyframes doorLeftReturnSwing {

      0%,
      8% {
        transform: scaleX(1);
      }

      22% {
        transform: scaleX(0.18) skewY(-6deg);
      }

      32%,
      58% {
        transform: scaleX(0.06) skewY(-10deg);
      }

      74% {
        transform: scaleX(0.75);
      }

      84%,
      100% {
        transform: scaleX(1);
      }
    }

    /* Right Door Swing Keyframes (Entrance) */
    @keyframes doorRightOpenClose {

      0%,
      15% {
        transform: scaleX(1);
      }

      28% {
        transform: scaleX(0.18) skewY(6deg);
      }

      38%,
      50% {
        transform: scaleX(0.06) skewY(10deg);
      }

      65% {
        transform: scaleX(0.75);
      }

      75%,
      100% {
        transform: scaleX(1);
      }
    }

    /* Right Door Swing Keyframes (Exit: opens for turtle exit then snaps shut) */
    @keyframes doorRightExitSwing {

      0%,
      10% {
        transform: scaleX(1);
      }

      25% {
        transform: scaleX(0.18) skewY(6deg);
      }

      35%,
      65% {
        transform: scaleX(0.06) skewY(10deg);
      }

      78% {
        transform: scaleX(0.75);
      }

      88%,
      100% {
        transform: scaleX(1);
      }
    }

    /* Turtle Entrance: walks from right door to center (5.2s) */
    @keyframes turtleEntranceKeyframes {

      0%,
      20% {
        transform: translate(345px, -50px) scale(0.74, 0.74);
        opacity: 0;
      }

      25% {
        transform: translate(345px, -50px) scale(0.74, 0.74);
        opacity: 1;
      }

      40% {
        transform: translate(280px, -45px) scale(0.80, 0.80);
        opacity: 1;
      }

      55% {
        transform: translate(185px, -32px) scale(0.87, 0.87);
        opacity: 1;
      }

      75% {
        transform: translate(80px, -15px) scale(0.94, 0.94);
        opacity: 1;
      }

      90%,
      100% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 1;
      }
    }

    /* Turtle Exit: walks in reverse along exact path back to right door (5.2s) */
    @keyframes turtleExitKeyframes {
      0% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 1;
      }

      20% {
        transform: translate(80px, -15px) scale(0.94, 0.94);
        opacity: 1;
      }

      40% {
        transform: translate(185px, -32px) scale(0.87, 0.87);
        opacity: 1;
      }

      60% {
        transform: translate(280px, -45px) scale(0.80, 0.80);
        opacity: 1;
      }

      75% {
        transform: translate(345px, -50px) scale(0.74, 0.74);
        opacity: 0.9;
      }

      85%,
      100% {
        transform: translate(350px, -50px) scale(0.72, 0.72);
        opacity: 0;
      }
    }

    /* Turtle Choreography after arriving at center (Duration: 7.2s):
       - Lean and body translation towards left jar, holding cookie, carrying across to right jar, lowering, then returning center
    */
    @keyframes turtleMoveCookieAction {

      0%,
      8% {
        transform: translate(0px, 0px) rotate(0deg);
      }

      16% {
        transform: translate(-70px, -2px) rotate(-3deg);
      }

      22%,
      35% {
        transform: translate(-105px, 6px) rotate(-5deg);
      }

      38%,
      43% {
        transform: translate(-88px, -2px) rotate(-3deg);
      }

      52% {
        transform: translate(0px, -2px) rotate(0deg);
      }

      64%,
      73% {
        transform: translate(92px, -2px) rotate(2deg);
      }

      78%,
      84% {
        transform: translate(96px, 6px) rotate(3deg);
      }

      94%,
      100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    /* TURTLE ARMS ANCHORED SHOULDER ROTATION
       Pivots cleanly around the shoulder sockets (Left: 790px, 340px; Right: 900px, 340px)
       Maintaining full continuous anatomy, no detachment from body or carapace
    */
    @keyframes turtleLeftArmPivot {

      0%,
      8% {
        transform: rotate(0deg);
      }

      15% {
        transform: rotate(-18deg);
      }

      20%,
      25% {
        /* Reaching down into left jar */
        transform: rotate(-36deg);
      }

      30%,
      34% {
        /* Lifting upward */
        transform: rotate(-16deg);
      }

      37%,
      43% {
        /* Holding proudly upward in front */
        transform: rotate(24deg);
      }

      49%,
      63% {
        /* Carrying across */
        transform: rotate(18deg);
      }

      66%,
      74% {
        /* Paused above right jar */
        transform: rotate(26deg);
      }

      78%,
      84% {
        /* Lowering straight down into right jar */
        transform: rotate(-32deg);
      }

      94%,
      100% {
        transform: rotate(0deg);
      }
    }

    @keyframes turtleRightArmPivot {

      0%,
      8% {
        transform: rotate(0deg);
      }

      15% {
        transform: rotate(-22deg);
      }

      20%,
      25% {
        /* Reaching down along with left arm */
        transform: rotate(-44deg);
      }

      30%,
      34% {
        /* Lifting cookie straight up */
        transform: rotate(-20deg);
      }

      37%,
      43% {
        /* Holding together with left arm */
        transform: rotate(18deg);
      }

      49%,
      63% {
        /* Carrying */
        transform: rotate(12deg);
      }

      66%,
      74% {
        /* Pausing over right jar */
        transform: rotate(22deg);
      }

      78%,
      84% {
        /* Lowering into right jar */
        transform: rotate(-38deg);
      }

      94%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* Cookie Transfer Path */
    @keyframes cookieTransferPath {

      0%,
      19% {
        opacity: 0;
        transform: translate(330px, 345px) scale(0.84);
      }

      20% {
        opacity: 0.2;
        transform: translate(330px, 345px) scale(0.84);
      }

      23% {
        opacity: 0.9;
        transform: translate(330px, 335px) scale(0.88);
      }

      27% {
        opacity: 1;
        transform: translate(330px, 296px) scale(0.94);
      }

      32% {
        opacity: 1;
        transform: translate(330px, 260px) scale(0.98);
      }

      /* Exact mirrored hold-above peak height over left jar midline (X: 330, Y: 230) */
      37%,
      43% {
        opacity: 1;
        transform: translate(330px, 230px) scale(1);
      }

      51% {
        opacity: 1;
        transform: translate(440px, 220px) scale(1.02);
      }

      60% {
        opacity: 1;
        transform: translate(580px, 225px) scale(1);
      }

      /* Midline alignment (X: 670) and clear HOLD-ABOVE moment */
      66%,
      74% {
        opacity: 1;
        transform: translate(670px, 230px) scale(1);
      }

      /* Straight vertical descent matching into right jar rim */
      76.5% {
        opacity: 1;
        transform: translate(670px, 260px) scale(0.98);
      }

      79.5% {
        /* Passing rim lip (Y: 296) */
        opacity: 1;
        transform: translate(670px, 296px) scale(0.94);
      }

      82% {
        /* Deep inside cavity */
        opacity: 1;
        transform: translate(670px, 335px) scale(0.88);
      }

      84%,
      100% {
        /* Settled inside right jar, fully clipped */
        opacity: 0;
        transform: translate(670px, 345px) scale(0.84);
      }
    }

    /* Left Jar pop impact when cookie is lifted out */
    @keyframes leftJarLiftPop {

      0%,
      25% {
        transform: scale(1, 1);
      }

      28% {
        transform: scale(0.97, 1.03) translateY(-2px);
      }

      32% {
        transform: scale(1.03, 0.97) translateY(2px);
      }

      36%,
      100% {
        transform: scale(1, 1);
      }
    }

    /* Left Jar Sparkles on lift out */
    @keyframes leftJarLiftStarsAction {

      0%,
      24% {
        opacity: 0;
        transform: scale(0);
      }

      27% {
        opacity: 1;
        transform: scale(1.15) translateY(-4px);
      }

      32% {
        opacity: 0.85;
        transform: scale(1.35) translateY(-14px);
      }

      38%,
      100% {
        opacity: 0;
        transform: scale(1.6) translateY(-24px);
      }
    }

    /* Right Jar pop impact when cookie lands */
    @keyframes rightJarReceivePop {

      0%,
      78% {
        transform: scale(1, 1);
      }

      80.5% {
        transform: scale(1.06, 0.94) translateY(4px);
      }

      83% {
        transform: scale(0.96, 1.04) translateY(-3px);
      }

      86% {
        transform: scale(1.02, 0.98) translateY(1px);
      }

      89%,
      100% {
        transform: scale(1, 1);
      }
    }

    /* Right Jar Sparkles on placement */
    @keyframes rightJarStarsAction {

      0%,
      78% {
        opacity: 0;
        transform: scale(0);
      }

      80.5% {
        opacity: 1;
        transform: scale(1.2) translateY(-6px);
      }

      85% {
        opacity: 0.9;
        transform: scale(1.45) translateY(-20px);
      }

      92%,
      100% {
        opacity: 0;
        transform: scale(1.8) translateY(-30px);
      }
    }

    /* Walking animation toggle classes */
    .bear-walking .anim-leg-l {
      animation: walkLegLeft 0.35s ease-in-out infinite;
      transform-origin: 440px 440px;
    }

    .bear-walking .anim-leg-r {
      animation: walkLegRight 0.35s ease-in-out infinite 0.175s;
      transform-origin: 560px 440px;
    }

    .bear-walking #bear-lean-grp {
      animation: walkBodyBob 0.35s ease-in-out infinite;
    }

    .turtle-walking .anim-turtle-leg-l {
      animation: walkLegLeft 0.38s ease-in-out infinite;
      transform-origin: 805px 450px;
    }

    .turtle-walking .anim-turtle-leg-r {
      animation: walkLegRight 0.38s ease-in-out infinite 0.19s;
      transform-origin: 885px 450px;
    }

    .turtle-walking #turtle-body-grp {
      animation: walkBodyBob 0.38s ease-in-out infinite;
    }

    .anim-blink {
      animation: charBlink 3.8s ease-in-out infinite;
      transform-origin: 500px 240px;
    }

    .anim-ear-l {
      animation: earWiggle 5s ease-in-out infinite;
      transform-origin: 430px 170px;
    }

    .anim-ear-r {
      animation: earWiggle 5s ease-in-out infinite 0.4s;
      transform-origin: 570px 170px;
    }

    .intro-arm {
      animation: bearArmLowering 3.6s cubic-bezier(0.33, 1, 0.68, 1) forwards;
      transform-origin: 440px 320px;
    }

    .intro-cookie {
      animation: bearCookieDescent 3.6s cubic-bezier(0.33, 1, 0.68, 1) forwards;
      transform-origin: 435px 345px;
    }

    .intro-jar1 {
      animation: jarPopImpact 3.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center center;
    }

    .intro-stars {
      animation: starBurstAction 3.6s ease-out forwards;
      transform-origin: 330px 290px;
    }

    .intro-gaze {
      animation: bearGazeFollow 3.6s ease-in-out forwards;
    }

    .anim-bear-departure {
      animation: bearDepartureFull 7.5s cubic-bezier(0.38, 0, 0.25, 1) forwards;
      transform-origin: 500px 440px;
    }

    .anim-bear-return {
      animation: bearReturnFull 5.2s cubic-bezier(0.33, 0, 0.25, 1) forwards;
      transform-origin: 500px 440px;
    }

    .anim-door-swing {
      animation: doorLeftOpenClose 7.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: 92px 300px;
    }

    .anim-door-left-return {
      animation: doorLeftReturnSwing 5.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: 92px 300px;
    }

    .anim-door-right-active {
      animation: doorRightOpenClose 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: 896px 300px;
    }

    .anim-door-right-exit {
      animation: doorRightExitSwing 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: 896px 300px;
    }

    .anim-turtle-active {
      animation: turtleEntranceKeyframes 5.2s cubic-bezier(0.33, 0, 0.25, 1) forwards;
      transform-origin: 500px 440px;
    }

    .anim-turtle-exit-active {
      animation: turtleExitKeyframes 5.2s cubic-bezier(0.33, 0, 0.25, 1) forwards;
      transform-origin: 500px 440px;
    }

    .turtle-move-cookie {
      animation: turtleMoveCookieAction 7.2s cubic-bezier(0.42, 0, 0.3, 1) forwards;
      transform-origin: 500px 440px;
    }

    .turtle-left-arm-active {
      animation: turtleLeftArmPivot 7.2s ease-in-out forwards;
      transform-origin: 790px 340px;
    }

    .turtle-right-arm-active {
      animation: turtleRightArmPivot 7.2s ease-in-out forwards;
      transform-origin: 900px 340px;
    }

    .cookie-moving-active {
      animation: cookieTransferPath 7.2s cubic-bezier(0.4, 0, 0.25, 1) forwards;
    }

    .left-jar-lift-pop-active {
      animation: leftJarLiftPop 7.2s ease-out forwards;
      transform-origin: center center;
    }

    .left-lift-stars-active {
      animation: leftJarLiftStarsAction 7.2s ease-out forwards;
      transform-origin: 330px 290px;
    }

    .right-jar-pop-active {
      animation: rightJarReceivePop 7.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center center;
    }

    .right-stars-active {
      animation: rightJarStarsAction 7.2s ease-out forwards;
      transform-origin: 670px 290px;
    }

    /* Interactive clickable jar hot zones */
    .jar-interactive {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center center;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .jar-interactive:hover {
      filter: drop-shadow(0 10px 18px rgba(30, 136, 229, 0.6));
      transform: translateY(-8px) scale(1.03);
    }

    .jar-interactive:active {
      transform: translateY(-2px) scale(0.98);
    }
  </style>
</head>

<body class="relative flex items-center justify-center min-h-screen bg-slate-950 select-none overflow-hidden"
  onclick="unlockAudio()">
  <!-- Main Game Stage Container (Maintains 1000x650 SVG Aspect Ratio seamlessly) -->
  <div
    class="relative w-full max-w-[1200px] h-[95vh] max-h-[780px] rounded-3xl overflow-hidden shadow-2xl bg-[#fcefdc] border-4 border-amber-900/20 flex flex-col justify-center items-center"
    id="game-stage">
    <!-- FULL VECTOR SCENE SVG (1000 x 650) -->
    <svg class="w-full h-full block" id="scene-svg" viewbox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <lineargradient id="wallGrad" x1="0%" x2="0%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#fff7ed"></stop>
          <stop offset="100%" stop-color="#f5e1cb"></stop>
        </lineargradient>
        <lineargradient id="tableTopGrad" x1="0%" x2="0%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#d48b47"></stop>
          <stop offset="100%" stop-color="#b86d2b"></stop>
        </lineargradient>
        <lineargradient id="bearBodyGrad" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#9d6b46"></stop>
          <stop offset="100%" stop-color="#7a4f2f"></stop>
        </lineargradient>
        <lineargradient id="bearMuzzleGrad" x1="0%" x2="0%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#fae2be"></stop>
          <stop offset="100%" stop-color="#ecc99a"></stop>
        </lineargradient>
        <!-- Rich Blue Glazed Ceramic For Both Jars -->
        <lineargradient id="jarUniformBlueGrad" x1="0%" x2="100%" y1="0%" y2="0%">
          <stop offset="0%" stop-color="#64b5f6"></stop>
          <stop offset="35%" stop-color="#1e88e5"></stop>
          <stop offset="100%" stop-color="#0d47a1"></stop>
        </lineargradient>
        <filter height="130%" id="dropShadow" width="130%" x="-10%" y="-10%">

    <!-- SOUND SYNTHESIS & INTERACTION SCRIPT -->
    <script>
      let canClick = false;
      let audioCtx = null;
      let selectedSide = null;
      let sequenceTimeouts = [];

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function unlockAudio() {
        getAudioContext();
      }

      // Friendly cartoon Web Audio synthesis sound effects
      function playChime(type) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'swish') {
            // Descending slide whistle/swish (putting cookie into jar)
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.linearRampToValueAtTime(1400, now + 0.3);
            filter.frequency.linearRampToValueAtTime(400, now + 0.7);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.35);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.7);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.3);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.7);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.71);
          } else if (type === 'liftSwish') {
            // Ascending cartoon slide whistle for lifting cookie out of left jar
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, now);
            filter.frequency.linearRampToValueAtTime(1200, now + 0.4);
            filter.frequency.linearRampToValueAtTime(1600, now + 0.75);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(360, now + 0.35);
            osc.frequency.exponentialRampToValueAtTime(540, now + 0.75);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.20, now + 0.35);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.75);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.76);
          } else if (type === 'cookieLift') {
            // Ascending popping sound when cookie reaches top apex above jar
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(640, now + 0.32);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.33);

            [780, 980].forEach((freq, idx) => {
              const sp = ctx.createOscillator();
              const g = ctx.createGain();
              sp.type = 'triangle';
              sp.frequency.setValueAtTime(freq, now + 0.08 + idx * 0.08);
              g.gain.setValueAtTime(0.1, now + 0.08 + idx * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + 0.28 + idx * 0.08);
              sp.connect(g);
              g.connect(ctx.destination);
              sp.start(now + 0.08 + idx * 0.08);
              sp.stop(now + 0.30 + idx * 0.08);
            });
          } else if (type === 'carryGlide') {
            // Gentle glide while turtle transports cookie across table
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.linearRampToValueAtTime(460, now + 0.6);
            osc.frequency.linearRampToValueAtTime(360, now + 1.2);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.08, now + 0.5);
            gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 1.22);
          } else if (type === 'drop') {
            // Cartoon plop with resonant chime harmonics
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.28);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.29);

            [880, 1174.66, 1396.91, 1760].forEach((freq, idx) => {
              const spOsc = ctx.createOscillator();
              const spGain = ctx.createGain();
              spOsc.type = 'triangle';
              spOsc.frequency.setValueAtTime(freq, now + 0.05 + idx * 0.06);
              spGain.gain.setValueAtTime(0.12, now + 0.05 + idx * 0.06);
              spGain.exponentialRampToValueAtTime(0.001, now + 0.32 + idx * 0.06);
              spOsc.connect(spGain);
              spGain.connect(ctx.destination);
              spOsc.start(now + 0.05 + idx * 0.06);
              spOsc.stop(now + 0.35 + idx * 0.06);
            });
          } else if (type === 'footstep') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.11);
          } else if (type === 'turtleStep') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'doorCreak') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.25);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.26);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.27);
          } else if (type === 'doorShut') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
          } else if (type === 'hover') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(940, now + 0.08);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'select') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'prompt') {
            const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.11);
              gain.gain.setValueAtTime(0.15, now + i * 0.11);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.11 + 0.32);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.11);
              osc.stop(now + i * 0.11 + 0.33);
            });
          }
        } catch (e) {
          console.warn('Audio note prevented: ', e);
        }
      }

      function clearAllTimeouts() {
        sequenceTimeouts.forEach(t => clearTimeout(t));
        sequenceTimeouts = [];
      }

      function schedule(fn, delay) {
        const id = setTimeout(fn, delay);
        sequenceTimeouts.push(id);
        return id;
      }

      function handleJarHover() {
        if (!canClick) return;
        playChime('hover');
      }

      function startSequence() {
        clearAllTimeouts();
        canClick = false;
        selectedSide = null;

        const bear = document.getElementById('bear-character-wrapper');
        const turtle = document.getElementById('turtle-character-wrapper');
        const turtleChoreo = document.getElementById('turtle-choreography-subgroup');
        const turtleArmL = document.getElementById('turtle-arm-l');
        const turtleArmR = document.getElementById('turtle-arm-r');
        const doorLeft = document.getElementById('door-left-leaf');
        const doorRight = document.getElementById('door-right-leaf');
        const cookieInRightJar = document.getElementById('anim-right-jar-cookie');
        const cookieInLeftJar = document.getElementById('anim-turtle-lift-cookie');
        const carriedCookie = document.getElementById('anim-carried-cookie');
        const leftJar = document.getElementById('jar-left-group');
        const leftStarsLift = document.getElementById('drop-stars-left-lift');
        const rightJar = document.getElementById('jar-right-group');
        const rightStars = document.getElementById('drop-stars-right');

        // Reset highlights & state classes
        document.getElementById('jar-left-glow').setAttribute('opacity', '0');
        document.getElementById('jar-right-glow').setAttribute('opacity', '0');
        bear.classList.remove('bear-walking', 'anim-bear-return', 'anim-bear-departure');
        bear.style.transform = '';
        bear.style.opacity = '1';
        turtle.classList.remove('turtle-walking', 'anim-turtle-active', 'anim-turtle-exit-active');
        turtleChoreo.classList.remove('turtle-move-cookie');
        turtleArmL.classList.remove('turtle-left-arm-active');
        turtleArmR.classList.remove('turtle-right-arm-active');
        cookieInRightJar.classList.remove('cookie-moving-active');
        cookieInLeftJar.classList.remove('cookie-moving-active');
        carriedCookie.classList.remove('cookie-moving-active');
        leftJar.classList.remove('left-jar-lift-pop-active');
        leftStarsLift.classList.remove('left-lift-stars-active');
        rightJar.classList.remove('right-jar-pop-active');
        rightStars.classList.remove('right-stars-active');
        doorRight.classList.remove('anim-door-right-active', 'anim-door-right-exit');
        doorLeft.classList.remove('anim-door-swing', 'anim-door-left-return');
        turtle.setAttribute('opacity', '0');

        // Restart intro & bear animation classes cleanly by triggering reflow
        const elementsToRestart = [
          { id: 'bear-lowering-arm', cls: 'intro-arm' },
          { id: 'anim-cookie', cls: 'intro-cookie' },
          { id: 'jar-left-group', cls: 'intro-jar1' },
          { id: 'drop-stars', cls: 'intro-stars' },
          { id: 'bear-pupils', cls: 'intro-gaze' },
          { id: 'bear-character-wrapper', cls: 'anim-bear-departure' },
          { id: 'door-left-leaf', cls: 'anim-door-swing' }
        ];

        elementsToRestart.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) {
            el.classList.remove(item.cls);
            void el.offsetWidth;
            el.classList.add(item.cls);
          }
        });

        // ================= CHOREOGRAPHY TIMELINE =================
        // 1. Swish sound when bear lowers cookie toward left jar
        schedule(() => {
          playChime('swish');
        }, 1200);

        // 2. Plop & stars chime when cookie drops into the left jar opening
        schedule(() => {
          playChime('drop');
        }, 1900);

        // 3. Bear starts walking directly towards the left door (t = 2650ms)
        schedule(() => {
          bear.classList.add('bear-walking');
          playChime('footstep');
        }, 2650);

        // Bear footsteps along path to door
        [3000, 3350, 3700, 4050, 4400, 4750, 5100, 5450].forEach(t => {
          schedule(() => {
            playChime('footstep');
          }, t);
        });

        // 4. Left Door opens smoothly as the bear approaches the doorway (~4000ms)
        schedule(() => {
          playChime('doorCreak');
        }, 4000);

        // 5. Left Door swings shut behind the bear (~6000ms)
        schedule(() => {
          bear.classList.remove('bear-walking');
          playChime('doorShut');
        }, 6000);

        // 6. Right door begins swinging open for Turtle entrance (~6500ms)
        schedule(() => {
          playChime('doorCreak');
          doorRight.classList.add('anim-door-right-active');
        }, 6500);

        // 7. Turtle emerges through right doorway and walks toward table center (~7100ms)
        schedule(() => {
          turtle.classList.add('anim-turtle-active', 'turtle-walking');
          playChime('turtleStep');
        }, 7100);

        // Turtle steps rhythm moving from right doorway to center spot
        [7500, 7900, 8300, 8700, 9100, 9500, 9900, 10300, 10700, 11100].forEach(t => {
          schedule(() => {
            playChime('turtleStep');
          }, t);
        });

        // 8. Right door shuts behind turtle (~8200ms)
        schedule(() => {
          playChime('doorShut');
        }, 8200);

        // 9. Turtle reaches center behind table (~11500ms) and pauses
        schedule(() => {
          turtle.classList.remove('turtle-walking');
        }, 11500);

        // ================= TURTLE COOKIE RELOCATION CHOREOGRAPHY =================
        // 10. Turtle starts turning/reaching toward left jar (t = 12000ms, start of 7.2s choreography)
        schedule(() => {
          turtleChoreo.classList.add('turtle-move-cookie');
          turtleArmL.classList.add('turtle-left-arm-active');
          turtleArmR.classList.add('turtle-right-arm-active');
          cookieInLeftJar.classList.add('cookie-moving-active');
          carriedCookie.classList.add('cookie-moving-active');
          cookieInRightJar.classList.add('cookie-moving-active');
          leftJar.classList.add('left-jar-lift-pop-active');
          leftStarsLift.classList.add('left-lift-stars-active');
          rightJar.classList.add('right-jar-pop-active');
          rightStars.classList.add('right-stars-active');
        }, 12000);

        // Turtle foot shuffle toward left jar
        [12500, 12900].forEach(t => {
          schedule(() => { playChime('turtleStep'); }, t);
        });

        // 11. MIRRORED REVERSE: Ascending cartoon slide whistle as cookie rises straight out of left jar (~13600ms)
        schedule(() => {
          playChime('liftSwish');
        }, 13600);

        // Pop / sparkle chime when cookie reaches the mirrored peak hold-above position above left jar (~14500ms)
        schedule(() => {
          playChime('cookieLift');
        }, 14500);

        // 12. Turtle carries cookie across table toward right jar
        schedule(() => {
          playChime('carryGlide');
        }, 15500);

        [15600, 16000, 16400, 16800].forEach(t => {
          schedule(() => { playChime('turtleStep'); }, t);
        });

        // 13. EXACT MATCH: Slide whistle/swish as turtle initiates vertical descent into right jar (t = 17300ms)
        schedule(() => {
          playChime('swish');
        }, 17300);

        // 14. EXACT MATCH: Cookie enters right jar opening - trigger plop sound and sparkle burst (t = 18000ms)
        schedule(() => {
          playChime('drop');
        }, 18000);

        // 15. Turtle finishes lowering, arms rest naturally against torso, returns to center pose (~19200ms)
        schedule(() => {
          turtleChoreo.classList.remove('turtle-move-cookie');
          turtleArmL.classList.remove('turtle-left-arm-active');
          turtleArmR.classList.remove('turtle-right-arm-active');
        }, 19200);

        // ================= EXIT SEQUENCE FOR MR. TURTLE =================
        // 16. Mr. Turtle starts walking along exact reverse path back to the right door (~19600ms)
        schedule(() => {
          turtle.classList.remove('anim-turtle-active');
          void turtle.offsetWidth;
          turtle.classList.add('anim-turtle-exit-active', 'turtle-walking');
          playChime('turtleStep');
        }, 19600);

        // Footsteps during exit walk back towards the right door
        [20000, 20400, 20800, 21200, 21600, 22000, 22400, 22800, 23200].forEach(t => {
          schedule(() => {
            playChime('turtleStep');
          }, t);
        });

        // 17. Right door swings open as Turtle approaches (~22200ms)
        schedule(() => {
          playChime('doorCreak');
          doorRight.classList.remove('anim-door-right-active');
          void doorRight.offsetWidth;
          doorRight.classList.add('anim-door-right-exit');
        }, 22200);

        // 18. Turtle steps fully through doorway and is completely hidden (~24000ms)
        schedule(() => {
          turtle.classList.remove('turtle-walking');
          turtle.setAttribute('opacity', '0');
        }, 24000);

        // 19. Right door clicks shut behind Turtle (~24800ms)
        schedule(() => {
          playChime('doorShut');
        }, 24800);

        // ================= MR. BEAR RE-ENTRANCE SEQUENCE =================
        // 20. Left door begins swinging open for Mr. Bear's return (~25400ms)
        schedule(() => {
          playChime('doorCreak');
          doorLeft.classList.remove('anim-door-swing');
          void doorLeft.offsetWidth;
          doorLeft.classList.add('anim-door-left-return');
        }, 25400);

        // 21. Mr. Bear steps through left door and begins walking back to center table (~25900ms)
        schedule(() => {
          bear.classList.remove('anim-bear-departure');
          void bear.offsetWidth;
          bear.classList.add('anim-bear-return', 'bear-walking');
          playChime('footstep');
        }, 25900);

        // Bear footsteps mirroring his walk back from left door to center table
        [26300, 26700, 27100, 27500, 27900, 28300, 28700, 29100, 29500, 29900].forEach(t => {
          schedule(() => {
            playChime('footstep');
          }, t);
        });

        // 22. Left door shuts behind Mr. Bear (~28800ms)
        schedule(() => {
          playChime('doorShut');
        }, 28800);

        // 23. Mr. Bear firmly resumes his exact original position standing behind the table (~31100ms)
        schedule(() => {
          bear.classList.remove('bear-walking');
        }, 31100);

        // ================= 24. ONLY ONCE MR. BEAR IS FIRMLY IN POSITION: JARS BECOME CLICKABLE (~31600ms) =================
        schedule(() => {
          canClick = true;

          // Gentle guide ring pulse to invite child's choice without revealing answer
          document.getElementById('jar-left-glow').setAttribute('opacity', '0.6');
          document.getElementById('jar-right-glow').setAttribute('opacity', '0.6');
          schedule(() => {
            if (!selectedSide) {
              document.getElementById('jar-left-glow').setAttribute('opacity', '0');
              document.getElementById('jar-right-glow').setAttribute('opacity', '0');
            }
          }, 750);

          playChime('prompt');
        }, 31600);
      }

      function handleJarChoice(side) {
        if (!canClick) return;

        selectedSide = side;
        playChime('select');

        // Neutral selection outline highlight on the chosen jar
        document.getElementById('jar-left-glow').setAttribute('opacity', side === 'left' ? '0.85' : '0');
        document.getElementById('jar-right-glow').setAttribute('opacity', side === 'right' ? '0.85' : '0');

        // Dispatch neutral event for parent or external tracking
        window.dispatchEvent(new CustomEvent('jarSelected', { detail: { side: side } }));
      }

      // Auto start on initial page load
      window.addEventListener('DOMContentLoaded', () => {
        startSequence();
      });
    </script>
  </div>
</body>

</html>
