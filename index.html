<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>false belief</title>
  <!-- The only outside file is the font for the grown-up pages; everything falls back to system fonts without it -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet" />
  <link href="shared/base.css" rel="stylesheet" />
</head>

<body>
  <!-- The stage every screen plays on (the scenes are drawn 1000 x 650). shared/storyline.js puts the screens
       from screens/ on it and shows one at a time. -->
  <div id="game-stage"></div>

  <!-- Shared code: sounds, the study's settings and answer log, the narration script, the storyline (screen
       order), then the animation engine and what it draws with. README.md explains how they fit together. -->
  <script src="shared/sounds.js"></script>
  <script src="shared/study.js"></script>
  <script src="shared/narration.js"></script>
  <script src="shared/storyline.js"></script>
  <script src="shared/engine.js"></script>
  <script src="shared/cast.js"></script>
  <script src="shared/kit.js"></script>
  <script src="shared/question.js"></script>

  <!-- One script per screen. The order they play in is SCREEN_ORDER in shared/storyline.js.
       a = attention check, t = test trial. -->
  <script src="screens/s1-setup.js"></script>
  <script src="screens/s2-ready.js"></script>
  <script src="screens/a1-school.js"></script>
  <script src="screens/t1-cookie.js"></script>
  <script src="screens/a2-playground.js"></script>

  <script src="screens/a6-scooter.js"></script>
  <script src="screens/t6-water.js"></script>
  <script src="screens/a7-gym.js"></script>
  <script src="screens/t7-book.js"></script>
  <script src="screens/a8-teacher.js"></script>
  <script src="screens/t8-balloon.js"></script>
  <script src="screens/end.js"></script>
  <script src="screens/script.js"></script>
</body>

</html>
